# Builds, tests and publishes a Wine-Plus runner for every plus-* tag
# (made by wine-plus/release.sh), then adds it to the runner index on the
# `repo` branch, which Q4Wine reads:
#   q4wine-ctl repo add https://raw.githubusercontent.com/<owner>/<repo>/repo/
name: Wine-Plus build

on:
  push:
    tags: ['plus-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plus-* tag to build again
        required: true
      channel:
        description: Channel in the runner index
        default: stable
        type: choice
        options: [stable, rc, unstable]

permissions:
  contents: write

concurrency:
  group: wine-plus-index   # serialise updates of the `repo` branch
  cancel-in-progress: false

jobs:
  build:
    # The oldest supported Ubuntu keeps the glibc requirement low, so the
    # runner also works on older distributions (Debian 12, ...).
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CHANNEL: ${{ inputs.channel || 'stable' }}
      # Inside the workspace: upload-artifact rejects paths with '..'.
      OUT: ${{ github.workspace }}/_out
      CCACHE_DIR: ${{ github.workspace }}/_ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          filter: blob:none   # history for the release notes, without all blobs

      - name: Install build dependencies
        run: sudo sh wine-plus/deps-debian.sh

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build
        run: |
          echo "NAME=wine-${TAG}-amd64" >> "$GITHUB_ENV"
          CCACHE=1 bash wine-plus/build.sh "wine-${TAG}-amd64"

      - name: Test
        run: bash wine-plus/test.sh "$OUT/$NAME"

      - name: Upload test logs
        if: always()
        continue-on-error: true   # never block the release
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ env.TAG }}
          path: ${{ env.OUT }}/test-*.log
          if-no-files-found: ignore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUT/$NAME.tar.xz" --clobber
            gh release edit "$TAG" --notes-file "$OUT/$NAME.notes.md"
          else
            gh release create "$TAG" "$OUT/$NAME.tar.xz" \
              --title "Wine-Plus ${TAG#plus-}" --notes-file "$OUT/$NAME.notes.md"
          fi

      - name: Add to the runner index (branch repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}.tar.xz"
          dir="$OUT/repo"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" repo > /dev/null; then
            git clone --depth 1 --branch repo "$remote" "$dir"
          else
            git init -b repo "$dir"
            git -C "$dir" remote add origin "$remote"
            printf '%s\n' "# Wine-Plus runner index" "" \
              "Bottles-format component repository, generated by the Wine-Plus build." \
              "Q4Wine: q4wine-ctl repo add https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/repo/" \
              > "$dir/README.md"
          fi
          python3 wine-plus/update-index.py "$dir" "$OUT/$NAME.tar.xz" "$url" --channel "$CHANNEL"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add $NAME" || { echo "index unchanged"; exit 0; }
          git push origin repo
